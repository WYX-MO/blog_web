{% extends 'base.html' %}

{% load static %}

{% block title %}
博客发布页
{% endblock %}

{% block head %}
<!-- 引入样式 -->

<link href="https://unpkg.com/@wangeditor/editor@latest/dist/css/style.css" rel="stylesheet" />
<script src="https://unpkg.com/@wangeditor/editor@latest/dist/index.js"></script>

<style>
    /* 工具栏背景 */
    .w-e-toolbar {
        background-color: #ffbc41 !important;
        border: none !important;
    }

    /* 编辑区域背景和默认文字色 */
    .w-e-text-container {
        background-color: #404141 !important;
        color: #ffffff !important;
    }

    #editor-container {
        height: 300px;
    }



    /* 代码块内文字 */
    .w-e-text-container code {
        color: #000000 !important;
        /* 浅灰色文字（清晰可见） */
        font-family: 'Consolas', 'Monaco', monospace !important;
        /* 等宽字体，更适合代码 */
        font-size: 14px !important;
    }

    /* 可选：代码块语法高亮优化（如果启用了语法高亮） */
    /* 关键字颜色 */
    .w-e-text-container code .keyword {
        color: #ff6f16 !important;
    }

    /* 字符串颜色 */
    .w-e-text-container code .string {
        color: #f1fa8c !important;
    }

    /* 注释颜色 */
    .w-e-text-container code .comment {
        color: #6272a4 !important;
    }
</style>
<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="{% static 'js/public_blog.js' %}"></script>
{% endblock %}

{% block main %}
<h1 class="text-white">发布新博客</h1>
<div class="mt-3">
    <form action="" method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label text-white" id="title-label">标题</label>
            <input type="text" class="form-control form-control-dark text-bg-dark text-white" id="title" name="title"
                required>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label text-white" id="category-label">分类</label>
            <select class="form-select form-select-dark text-bg-dark text-white " id="category" name="category"
                required>
                <option value="" selected disabled>请选择分类</option>
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <div id="editor-wrapper">
                <div id="toolbar-container"><!-- 工具栏 --></div>
                <div id="editor-container"><!-- 编辑器 --></div>
            </div>
            <!-- <label for="content" class="form-label text-white">内容</label>
                        <textarea class="form-control form-control-dark text-bg-dark text-white" id="content" name="content" rows="5" required></textarea> -->
        </div>
        <div class="text-end">
            <button type="button" class="btn btn-warning" id="submit-btn" name="submit-btn">发布</button>
        </div>
    </form>
</div>
{% endblock %}
