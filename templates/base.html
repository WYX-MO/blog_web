{% load static %}

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <!-- 引入Tailwind CSS CDN（生产环境建议本地部署） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome图标库（图标可替换，参考https://fontawesome.com/v4/icons/） -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入圆润卡通字体（可替换为其他字体，如幼圆、微软雅黑等） -->
    <link
        href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- 原有的-->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>


    <script>
        $(function () {
            var isAuthenticated = "{{ request.user.is_authenticated }}" === "True";

            $(document).on("click", "#star-show", function (e) {
                e.preventDefault(); // 阻止<a>标签默认跳转
                const $a = $(this);

                if (!isAuthenticated) {
                    window.location.href = "{% url 'blogAuth:blogAuth_login' %}";
                    return;
                }

                // 跳转到index页面，URL参数传递?flag=1
                window.location.href = "{% url 'blogMain:blogMain_search' %}?q=user_stared_114";
            });
        });
    </script>


    <!-- 自定义Tailwind配置（颜色、动画、圆角等核心样式配置区） -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 主题色配置区 - 可修改为自己的品牌色
                        primary: '#2D6A4F',    // 森林绿主色
                        secondary: '#1B4332',  // 深林绿辅助色
                        accent: '#F9C74F',     // 萤火黄点缀色
                        star: '#90E0EF',       // 星空蓝
                        neutral: {
                            100: '#F8F9FA',    // 浅灰
                            200: '#E9ECEF',    // 中浅灰
                            800: '#1A1A2E',    // 深灰
                            900: '#0F3460',    // 最深灰/深蓝
                        },
                    },
                    fontFamily: {
                        // 字体配置区 - 可替换为其他圆润字体
                        'round': ['ZCOOL KuaiLe', 'cursive'], // 最圆润的卡通字体
                        'round-secondary': ['Ma Shan Zheng', 'cursive'], // 次圆润字体
                        'sans': ['Noto Sans SC', 'sans-serif'], // 基础无衬线字体
                    },
                    animation: {
                        // 动画配置区 - 可调整动画时长、效果
                        'float': 'float 6s ease-in-out infinite',     // 漂浮动画
                        'twinkle': 'twinkle 3s ease-in-out infinite', // 闪烁动画
                        'firefly': 'firefly 8s ease-in-out infinite', // 萤火虫动画
                        'pulse-soft': 'pulseSoft 4s ease-in-out infinite', // 柔和脉冲
                        'fade-in': 'fadeIn 1s ease-out forwards',     // 淡入
                        'slide-up': 'slideUp 0.8s ease-out forwards', // 上滑
                    },
                    keyframes: {
                        // 动画关键帧定义 - 可调整动画细节
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-10px) rotate(1deg)' },
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 },
                        },
                        twinkle: {
                            '0%, 100%': { opacity: 0.5, transform: 'scale(1)' },
                            '50%': { opacity: 1, transform: 'scale(1.1)' },
                        },
                        firefly: {
                            '0%': { transform: 'translate(0, 0)', opacity: 0 },
                            '25%': { transform: 'translate(15px, -10px)', opacity: 1 },
                            '50%': { transform: 'translate(30px, 5px)', opacity: 0.8 },
                            '75%': { transform: 'translate(10px, 15px)', opacity: 1 },
                            '100%': { transform: 'translate(0, 0)', opacity: 0 },
                        },
                        pulseSoft: {
                            '0%, 100%': { transform: 'scale(1)', boxshadow: '0 0 15px rgba(249, 199, 79, 0.2)' },
                            '50%': { transform: 'scale(1.03)', boxshadow: '0 0 25px rgba(249, 199, 79, 0.4)' },
                        },
                    },
                    borderRadius: {
                        // 圆角配置区 - 可调整圆角大小
                        'cartoon': '30px',    // 基础卡通圆角
                        'cartoon-lg': '40px', // 大卡通圆角
                        'btn-full': '9999px', // 全圆角（按钮用）
                    }
                },
            }
        }
    </script>

    <!-- 自定义工具类（可扩展自己的样式类） -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .cartoon-shadow {
                box-shadow: 0 8px 0 rgba(15, 52, 96, 0.12), 0 4px 10px rgba(15, 52, 96, 0.08);
            }
            .bg-blur {
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
            .text-cartoon {
                text-shadow: 1px 1px 0 rgba(15, 52, 96, 0.1);
            }
            .cartoon-border {
                border: 3px solid #0F3460;
                border-radius: 30px;
                box-shadow: 4px 4px 0 #0F3460;
            }
            .star-glow {
                box-shadow: 0 0 12px rgba(144, 224, 239, 0.6), 0 0 20px rgba(144, 224, 239, 0.3);
            }
            .firefly-glow {
                box-shadow: 0 0 10px rgba(249, 199, 79, 0.8), 0 0 20px rgba(249, 199, 79, 0.5);
            }
            .btn-round {
                border-radius: 9999px !important;
            }
            .btn-round-lg {
                border-radius: 40px !important;
            }
        }
    </style>

    <style>
        /* 基础全局样式 */
        body {
            background: linear-gradient(180deg, #0F3460 0%, #1A1A2E 50%, #1B4332 100%);
            background-attachment: fixed;
            background-position: center;
            overflow-x: hidden;
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
        }

        /* 星空背景（可修改星星大小、颜色、密度） */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80%;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #90E0EF, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 40px 70px, #FFFFFF, rgba(0, 0, 0, 0)),
                radial-gradient(1px 1px at 90px 40px, #FFFFFF, rgba(0, 0, 0, 0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.6;
            z-index: -2;
        }

        /* 森林剪影背景 - 【替换图片位置1】 */
        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75%;
            background-image: url("{% static 'image/bk.png' %}");
            /* 替换为自己的森林剪影图片URL */
            background-size: cover;
            background-position: bottom;
            opacity: 0.3;
            z-index: -1;
            mask-image: linear-gradient(to top, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 70%, transparent 100%);
        }

        /* 萤火虫样式（可调整大小、颜色） */
        .firefly {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #F9C74F;
            border-radius: 50%;
            opacity: 0;
            z-index: 1;
        }

        /* 文章卡片悬停效果（可调整悬停位移、阴影） */
        .post-card {
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .post-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 0 rgba(15, 52, 96, 0.15), 0 8px 15px rgba(15, 52, 96, 0.1);
        }

        /* 森林风格分割线（可修改颜色、高度、宽度） */
        .cartoon-divider {
            height: 6px;
            background: linear-gradient(90deg, transparent, #2D6A4F, #F9C74F, #90E0EF, transparent);
            border-radius: 3px;
            width: 80%;
            margin: 2rem auto;
        }

        /* 按钮样式（可调整悬停效果） */
        .cartoon-btn {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 9999px;
        }

        .cartoon-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 0 rgba(15, 52, 96, 0.1);
        }

        /* 图片滤镜（可调整滤镜参数） */
        .forest-filter {
            filter: sepia(15%) hue-rotate(100deg) brightness(0.95) contrast(1.05);
            transition: filter 0.4s ease;
        }

        .forest-filter:hover {
            filter: sepia(10%) hue-rotate(100deg) brightness(1) contrast(1.1);
        }

        /* 输入框样式（可调整边框、阴影） */
        input[type="text"],
        input[type="email"],
        textarea {
            border-radius: 9999px !important;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            transform: translateY(-1px);
            box-shadow: 0 0 15px rgba(249, 199, 79, 0.3);
        }

        /* 分类标签样式 */
        .category-tag {
            border-radius: 9999px !important;
        }

        /* 导航下划线动画 */
        .nav-underline {
            transition: all 0.4s ease;
        }
    </style>
    {% block head %}{% endblock %}
</head>

    <!-- JavaScript - 【后端对接核心区域】 -->
    <script>
        // ===================== 基础功能 =====================
        // 返回顶部按钮
        const backToTopBtn = document.getElementById('back-to-top');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.remove('opacity-0', 'invisible');
                backToTopBtn.classList.add('opacity-100', 'visible', 'animate-pulse-soft');
            } else {
                backToTopBtn.classList.add('opacity-0', 'invisible');
                backToTopBtn.classList.remove('opacity-100', 'visible', 'animate-pulse-soft');
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
            backToTopBtn.classList.add('animate-bounce');
            setTimeout(() => {
                backToTopBtn.classList.remove('animate-bounce');
            }, 800);
        });

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();

                const targetId = this.getAttribute('href');
                const targetElement = document.querySelector(targetId);

                if (targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 80,
                        behavior: 'smooth'
                    });
                }
            });
        });

        // 元素进入视口动画
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = 1;
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1 });

        // 初始化动画元素
        document.querySelectorAll('.animate-fade-in, .animate-slide-up, .animate-twinkle').forEach(el => {
            el.style.opacity = 0;
            if (el.classList.contains('animate-slide-up')) {
                el.style.transform = 'translateY(20px)';
            }
            el.style.transition = 'opacity 0.8s ease-out, transform 0.6s ease-out';
            observer.observe(el);
        });

        // 生成少量萤火虫
        function createFireflies(count) {
            const container = document.body;
            for (let i = 0; i < count; i++) {
                const firefly = document.createElement('div');
                firefly.classList.add('firefly', 'animate-firefly');
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const delay = Math.random() * 6;
                firefly.style.top = `${top}%`;
                firefly.style.left = `${left}%`;
                firefly.style.animationDelay = `${delay}s`;
                container.appendChild(firefly);
            }
        }

    </script>
