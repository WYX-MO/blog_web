{% extends 'base.html' %}
<!DOCTYPE html>
{% block title %}
    注册
{% endblock %}

{% block main %}
<div style="width: 300px; margin: auto;">
    <h1>注册</h1>
    <form action="" method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="exampleInputUsername1" class="form-label">Username</label>
            <input type="text" class="form-control" placeholder="请输入用户名" name="username" id="exampleInputUsername1">
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" id="exampleInputEmail1" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text text-white">We'll never share your email with anyone else.</div>
        </div>
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="请输入验证码" name="verify_code"
                aria-describedby="button-addon2">
            <button class="btn btn-outline-secondary" type="button" id="button-addon2">获取验证码</button>
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" name="password" id="exampleInputPassword1">
        </div>
        <button type="submit" class="btn btn-warning w-100">Submit</button>
    </form>
</div>
{% endblock %}
