{%extends 'base.html' %}
{% load static %}
{% block title %}
    博客详情
{% endblock %}

{% block main %}
<h1>博客详情页</h1>
<hr>
<div class="mt-2">
    <img src="{% static 'image/logo_img.png' %}" alt="Author Avatar" width="30" height="30"
        class="d-inline-block align-text-top rounded-circle">
    <span class="ms-2 text-white">Author Name</span>
    <span class="ms-2 text-white">于</span>
    <span class="ms-2 text-white">2023-10-10</span>发布
</div>
<hr>
<div class="py-2">
    <h3 class="text-white">博客标题</h3>
</div>

<!-- <div class="card text-bg-dark" style="width: 100%; border: 4px solid #756b68; border-radius: 0.5rem;">
            <div class="card-body" style="background-color: #272c31;">
                <h3 class="card-title">博客标题</h3>
                <p class="card-text">这里是博客的详细内容。可以包含多段文字、图片等丰富内容。</p>
            </div>  
            <div class="card-footer" style="background-color: #272c31;">
                <p class="card-text text-end">发布时间：2023-10-10</p>
            </div>
        </div> -->

<hr>
<div class="mt-2">
    <h3 class="text-white">评论(1)</h3>
    <form action="" method="post">
        {% csrf_token %}
        <div class="input-group mb-3">
            <span class="input-group-text text-white bg-dark" id="inputGroup-sizing-default">To Author Name</span>
            <input type="text" class="form-control text-white bg-dark" aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default">
        </div>
        <div class="text-end">
            <button type="submit" class="btn btn-warning">submit</button>
        </div>

    </form>
</div>

<div class="mt-2">
    <ul class="list-group list-group-flush">
        <li class="list-group-item text-bg-dark mb-2">

            <div class="d-flex align-items-center mb-2">
                <img src="{% static 'image/logo_img.png' %}" alt="" width="30" height="30"
                    class="d-inline-block align-text-top rounded-circle">
                <span class="ms-2 text-white">Commenter Name</span>
                <span class="ms-2 text-white">于</span>
                <span class="ms-2 text-white">2023-10-11</span>评论
            </div>
            <p class="text-white">这是评论的内容。</p>

        </li>
    </ul>
</div>
{% endblock %}
