<!-- {% load static %} -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blog Main</title>
    <!-- <link rel="stylesheet" href="{% static 'css/styles.css' %}"> -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</head>

<body class="custom-bg-gradient">
    <header class="p-3 text-bg-dark border-bottom mb-3">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <img src="{% static 'image/logo_img.png' %}" alt="Bootstrap" width="55" height="55"
                        class="d-inline-block align-text-top rounded-5">
                </a>

                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="#" class="nav-link px-2 text-secondary">主页</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">广场</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">MAN！</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">问题</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">关于</a></li>
                </ul>

                <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
                    <input type="search" class="form-control form-control-dark text-bg-dark text-white" placeholder="搜索..."
                        aria-label="Search">
                </form>

                <div class="text-end">
                    <button type="button" class="btn btn-outline-light me-2">登录</button>
                    <button type="button" class="btn btn-warning">注册</button>
                </div>
            </div>
        </div>
    </header>

<main class = "container mt-5 p-3 bg-dark rounded-5">
    <h1 class="text-white">博客主页</h1>
        <div class="row row-cols-2 row-gap-4">
            <div class="col">
                <!-- 文章卡片 -->
                <div class="card text-bg-dark" style="width: 100%; border: 4px solid #756b68; border-radius: 0.5rem;">
                    <!-- <img src="..." class="card-img-top" alt="..."
                        style="border-top-left-radius: 0.375rem; border-top-right-radius: 0.375rem;"> -->

                    <div class="card-body" style ="background-color: #272c31;">
                        <h5 class="card-title">Card title</h5>
                        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's
                            content.</p>
                    </div>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item text-bg-dark border-top border-secondary">
                            111
                        </li>
                        <li class="list-group-item text-bg-dark border-top border-secondary">A second item</li>
                        <li class="list-group-item text-bg-dark border-top border-secondary">A third item</li>
                    </ul>

                    <div class="card-body d-flex justify-content-between" style ="background-color: #272c31;">
                        <div>
                            <button type="button" class="btn btn-outline-light me-2">111</button>
                        <button type="button" class="btn btn-warning">222</button>
                        </div>
                        
                        <div class="d-flex align-items-center gap-2">
                            <div>
                            <img src="{% static 'image/logo_img.png' %}" alt="Bootstrap" width="30" height="30"
                                class="d-inline-block align-text-top rounded-circle">
                            </div>
                            <div>
                                <text class="text-white">2024-06-01</text>
                            </div>  
                        </div>
                    </div>

                </div>
                <!-- /文章卡片 -->
                 
            </div>
            
        </div>
</body>

</html>
