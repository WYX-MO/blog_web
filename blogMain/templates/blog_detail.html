<!-- {% load static %} -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blog Main</title>
    <!-- <link rel="stylesheet" href="{% static 'css/styles.css' %}"> -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</head>

<body class="custom-bg-gradient">
    <header class="p-3 text-bg-dark border-bottom mb-3">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <img src="{% static 'image/logo_img.png' %}" alt="Bootstrap" width="55" height="55"
                        class="d-inline-block align-text-top rounded-5">
                </a>

                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="{% url 'blogMain:blogMain_index' %}" class="nav-link px-2 text-secondary">主页</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">广场</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">MAN！</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">问题</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">关于</a></li>
                </ul>

                <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
                    <input type="search" class="form-control form-control-dark text-bg-dark text-white"
                        placeholder="搜索..." aria-label="Search">
                </form>

                <div class="text-end">
                    <button type="button" class="btn btn-outline-light me-2">登录</button>
                    <button type="button" class="btn btn-warning">注册</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mt-5 p-3 bg-dark rounded-5">
        <h1>博客详情页</h1>
        <hr>
        <div class="mt-2">
            <img src="{% static 'image/logo_img.png' %}" alt="Author Avatar" width="30" height="30"
                class="d-inline-block align-text-top rounded-circle">
                <span class="ms-2 text-white">Author Name</span>
                <span class="ms-2 text-white">于</span>
                <span class="ms-2 text-white">2023-10-10</span>发布
        </div>
        <hr>
        <div class="py-2">
            <h3 class="text-white">博客标题</h3>
        </div>

        <!-- <div class="card text-bg-dark" style="width: 100%; border: 4px solid #756b68; border-radius: 0.5rem;">
            <div class="card-body" style="background-color: #272c31;">
                <h3 class="card-title">博客标题</h3>
                <p class="card-text">这里是博客的详细内容。可以包含多段文字、图片等丰富内容。</p>
            </div>  
            <div class="card-footer" style="background-color: #272c31;">
                <p class="card-text text-end">发布时间：2023-10-10</p>
            </div>
        </div> -->

        <hr>
        <div class="mt-2">
            <h3 class="text-white">评论(1)</h3>
            <form action="" method="post">
                {% csrf_token %}
                <div class="input-group mb-3">
                    <span class="input-group-text text-white bg-dark" id="inputGroup-sizing-default">To Author Name</span>
                    <input type="text" class="form-control text-white bg-dark" aria-label="Sizing example input"
                        aria-describedby="inputGroup-sizing-default">
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-warning">submit</button>
                </div>
                
            </form>
        </div>

        <div class="mt-2">
            <ul class="list-group list-group-flush">
                <li class="list-group-item text-bg-dark mb-2">

                    <div class="d-flex align-items-center mb-2">
                        <img src="{% static 'image/logo_img.png' %}" alt="" width="30" height="30"
                            class="d-inline-block align-text-top rounded-circle">
                        <span class="ms-2 text-white">Commenter Name</span>
                        <span class="ms-2 text-white">于</span>
                        <span class="ms-2 text-white">2023-10-11</span>评论
                    </div>
                    <p class="text-white">这是评论的内容。</p>

                </li>
            </ul>
        </div>

    </main> 
    
        
</body>

</html>
