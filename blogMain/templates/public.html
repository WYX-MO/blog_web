<!-- {% load static %} -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blog Main</title>
    <!-- <link rel="stylesheet" href="{% static 'css/styles.css' %}"> -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <!-- 引入样式 -->
    <link href="https://unpkg.com/@wangeditor/editor@latest/dist/css/style.css" rel="stylesheet" />
    <!-- 引入 JS -->
    <script src="https://unpkg.com/@wangeditor/editor@latest/dist/index.js"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <style>
        /* 工具栏背景 */
        .w-e-toolbar {
            background-color: #d69f39 !important;
        
            /* 橙色工具栏 */
            border: none !important;
        }

        /* 编辑区域背景 */
        .w-e-text-container {
            background-color: #414040 !important;
            color: #ffffff !important;
        }
        #editor-container {
            height: 300px;

        }
    </style>
    
    <script src="{% static 'public_blog.js' %}"></script>
</head>

<body class="custom-bg-gradient">
    <header class="p-3 text-bg-dark border-bottom mb-3">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <img src="{% static 'image/logo_img.png' %}" alt="Bootstrap" width="55" height="55"
                        class="d-inline-block align-text-top rounded-5">
                </a>

                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="#" class="nav-link px-2 text-secondary">主页</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">广场</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">MAN！</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">问题</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">关于</a></li>
                </ul>

                <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
                    <input type="search" class="form-control form-control-dark text-bg-dark text-white"
                        placeholder="搜索..." aria-label="Search">
                </form>

                <div class="text-end">
                    <button type="button" class="btn btn-outline-light me-2">登录</button>
                    <button type="button" class="btn btn-warning">注册</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mt-5 p-3 bg-dark rounded-5">
        <h1 class="text-white">发布新博客</h1>
        <div class="mt-3">
            <form action="" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label text-white">标题</label>
                    <input type="text" class="form-control form-control-dark text-bg-dark text-white" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label text-white">分类</label>
                    <select class="form-select form-select-dark text-bg-dark text-white" id="category" name="category" required>
                        <option value="" selected disabled>请选择分类</option>
                        <option value="1">分类1</option>
                        <option value="2">分类2</option>
                        <option value="3">分类3</option>
                    </select>
                </div>
                <div class="mb-3">
                    <div id="editor-wrapper">
                        <div id="toolbar-container"><!-- 工具栏 --></div>
                        <div id="editor-container"><!-- 编辑器 --></div>
                    </div>
                    <!-- <label for="content" class="form-label text-white">内容</label>
                    <textarea class="form-control form-control-dark text-bg-dark text-white" id="content" name="content" rows="5" required></textarea> -->
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-warning">发布</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
